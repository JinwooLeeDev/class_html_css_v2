<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="card">
      <div class="card-top">
        <img src="https://picsum.photos/150/150" alt="" class="profile-img"/>
        <h3 class="name">이진우</h3>
        <p class="role">Frontend Developer</p>
      </div>
      <div class="card-stats">
        <div class="stat">
          <b><div>42</div></b>
          <span>프로젝트</span>
        </div>
        <div class="stat">
          <b><div>128</div></b>
          <span>커밋</span>
        </div>
        <div class="stat">
          <b><div>7</div></b>
          <span>팔로워</span>
        </div>
      </div>
      <div class="card-skills">
        <span class="badge">HTML</span>
        <span class="badge">CSS</span>
        <span class="badge">JavaScript</span>
      </div>
      <button class="btn-follow">팔로우</button>
    </div>
  </body>
</html>
